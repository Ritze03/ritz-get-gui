<meta charset="utf-8">
<title>ritz-get GUI · Graphite</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;700&family=Geist+Mono:wght@400;700&display=swap">
<style>
/* Layout (Graphite "nested panes"): VBox[ TopBar, RestartBar, Body HBox[ GroupsPane | SidePane ], LogPane, StatusBar ].
   Every pane clips (overflow) and sizes its rows from its own width; tiles, cards and rows wrap or stack, nothing is absolutely placed
   (the "…" menu and the Reset modal are the only overlay layers). Graphite is a single dark look, so there is no light variant. */
:root {
  color-scheme: dark;
  /* Graphite role tokens (names from the spec, lower-kebab-case) */
  --accent: #5B8BF0;        /* ACCENT */
  --head: #14171A;          /* HEAD */
  --panel: #1E2125;         /* PANEL */
  --panel2: #191C1F;        /* PANEL2 */
  --field: #15181B;         /* FIELD */
  --border: #2C3036;        /* BORDER */
  --btn: #262A30;           /* BTN */
  --btnbd: #343941;         /* BTNBD */
  --text: #E7E9EC;          /* TEXT */
  --dim: #969CA6;           /* DIM */
  --faint: #646A73;         /* FAINT */
  --primary-text: #0B1222;  /* PRIMARY_TEXT */
  --danger: #E15554;        /* DANGER */
  --good: #6CC551;          /* GOOD */
  --warn: #D8B455;          /* WARN */
  /* steel(lum) = rgb(0.9·lum, lum, min(255, 1.17·lum)) */
  --text-dim: rgb(135 150 175.5);   /* TEXT_DIM   steel(150) */
  --text-faint: rgb(94.5 105 122.85); /* TEXT_FAINT steel(105) */
  --stroke-mid: rgb(72 80 93.6);    /* STROKE_MID steel(80) */
  --stroke-dim: rgb(45 50 58.5);    /* STROKE_DIM steel(50) */
  --track: rgb(36 40 46.8);         /* TRACK      steel(40) */
  --well: rgb(21.6 24 28.08);       /* WELL       steel(24) */
  /* tints */
  --sel: color-mix(in srgb, var(--accent) 16%, transparent);   /* SEL */
  --selbd: color-mix(in srgb, var(--accent) 42%, transparent); /* SELBD */
  --hov: rgb(255 255 255 / 5%);                                /* HOV */
  --shade: color-mix(in srgb, var(--head) 72%, transparent);   /* derived from HEAD: menu shadow, modal backdrop */

  /* type: Geist for UI text, Geist Mono where columns must align (versions, paths, log, counts); icon glyphs are Geist Mono Nerd Font outlines inlined as SVG */
  --font: "Geist", system-ui, "Segoe UI", Roboto, sans-serif;
  --mono: "Geist Mono", ui-monospace, "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace;
  --fs-heading: 18px; --fs-body: 13px; --fs-button: 13px; --fs-small: 11px; --fs-mono: 12px;
  --fs-pill: 12.5px; --fs-seg: 14px; --fs-title: 12px; --fs-word: 16px;
  /* metrics */
  --r: 7px; --r-box: 5px; --r-tab: 4px; --ctl: 22px;
  --gap: 8px; --row-gap: 4px; --card-pad: 6px;
  --gut-l: max(16px, env(safe-area-inset-left, 0px));
  --gut-r: max(16px, env(safe-area-inset-right, 0px));
}

html, body { height: 100%; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--panel); color: var(--text); font-family: var(--font); font-size: var(--fs-body); line-height: 1.4; }
*, *::before, *::after { box-sizing: border-box; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
::selection { background: var(--selbd); color: var(--text); }
:focus-visible { outline: 1px solid var(--accent); outline-offset: 1px; }
* { scrollbar-color: var(--btnbd) transparent; scrollbar-width: thin; }
a { color: var(--accent); }

/* ---------- glyphs ---------- */
.nf { width: 1em; height: 1em; flex: 0 0 auto; display: block; fill: currentColor; }
.g { width: 16px; height: 16px; flex: 0 0 auto; display: inline-flex; align-items: center; justify-content: center; font-size: 13px; color: var(--text-dim); }

/* ---------- app shell ---------- */
.app { height: 100%; display: flex; flex-direction: column; min-width: 0; }

/* top bar */
.topbar { flex: 0 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: var(--gap); background: var(--head);
  padding-block: 4px 5px; padding-left: var(--gut-l); padding-right: var(--gut-r); }
.brand { font-size: var(--fs-word); font-weight: 700; color: var(--accent); white-space: nowrap; }
.vdiv { width: 1px; height: 18px; background: var(--border); flex: 0 0 auto; }
.pagepill { font-size: var(--fs-pill); color: var(--text); background: var(--sel); border: 1px solid var(--selbd); border-radius: 999px;
  padding: 2px 12px; min-width: 11ch; text-align: center; white-space: nowrap; }
.seg { display: inline-grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); height: 32px; padding: 3px; max-width: 100%; min-width: 0;
  background: var(--field); border: 1px solid var(--border); border-radius: 999px; }
.seg button { min-width: 0; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 0 10px; border: 1px solid transparent;
  border-radius: 999px; background: none; color: var(--text-dim); font-size: var(--fs-seg); white-space: nowrap; overflow: hidden; }
.seg button:hover { background: var(--hov); }
.seg button[aria-pressed="true"] { background: var(--sel); border-color: var(--selbd); color: var(--text); }
.seg .n { font-size: var(--fs-small); color: var(--text-faint); font-variant-numeric: tabular-nums; }
.seg .n.hot { color: var(--warn); }
.spacer { flex: 1 1 0; min-width: 0; }
.search { flex: 0 1 220px; min-width: 120px; height: var(--ctl); display: flex; align-items: center; gap: 6px; padding: 0 8px;
  background: var(--field); border: 1px solid var(--btnbd); border-radius: var(--r); color: var(--dim); font-size: 12px; }
.search:hover { border-color: var(--accent); }
.search:focus-within { border-color: var(--accent); }
.search input { flex: 1 1 auto; min-width: 0; border: 0; background: none; outline: none; color: var(--text); font-size: var(--fs-body); padding: 0; }
.search input::placeholder { color: var(--dim); }
.tabbtn { width: 30px; height: 30px; flex: 0 0 auto; display: inline-flex; align-items: center; justify-content: center; border: 0;
  border-radius: var(--r-tab); background: none; color: var(--text-dim); font-size: 15px; }
.tabbtn:hover { background: var(--btn); }
.tabbtn[aria-pressed="true"] { background: var(--sel); color: var(--accent); }

/* buttons */
.btn { height: var(--ctl); display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 0 9px;
  border: 1px solid var(--btnbd); border-radius: var(--r); background-color: var(--btn); color: var(--text);
  font-size: var(--fs-button); line-height: 1; white-space: nowrap; }
.btn:hover { border-color: var(--accent); background-image: linear-gradient(var(--hov), var(--hov)); }
.btn:active { border-color: var(--selbd); }
.btn.primary { background-color: var(--accent); border-color: var(--accent); color: var(--primary-text); font-weight: 700; }
.btn.primary:active { border-color: var(--selbd); }
.btn.danger { background-color: transparent; color: var(--danger); border-color: color-mix(in srgb, var(--danger) 42%, transparent); }
.btn.danger:hover { border-color: var(--danger); }
.btn:disabled, .btn:disabled:hover { cursor: default; background-color: var(--btn); background-image: none; border-color: var(--border); color: var(--faint); font-weight: 400; }
.btn.sq { width: var(--ctl); padding: 0; }
.btn.more { padding-bottom: 5px; }

/* restart bar (D25) */
.restart-bar { flex: 0 0 auto; display: flex; align-items: center; flex-wrap: wrap; gap: var(--gap); margin: var(--gap) var(--gut-r) 0 var(--gut-l);
  padding: 4px 4px 4px 10px; border-radius: var(--r); border: 1px solid color-mix(in srgb, var(--good) 42%, transparent);
  background: color-mix(in srgb, var(--good) 12%, transparent); }
.restart-bar .msg { flex: 1 1 16ch; min-width: 0; display: flex; align-items: center; gap: 8px; }
.dot { width: 7px; height: 7px; border-radius: 50%; flex: 0 0 auto; background: var(--good); }

/* body: two column panes */
.body { flex: 1 1 auto; min-height: 0; display: flex; gap: var(--gap); padding-block: var(--gap); padding-left: var(--gut-l); padding-right: var(--gut-r); }
.groups { flex: 1 1 auto; min-width: 0; overflow: auto; display: flex; flex-direction: column; gap: 12px; padding-right: 2px; }
.side { flex: 0 0 300px; min-width: 0; overflow: auto; background: var(--panel2); border: 1px solid var(--border); border-radius: var(--r); }

/* group = collapsible category */
.group { display: flex; flex-direction: column; gap: var(--gap); flex: 0 0 auto; min-width: 0; }
.group-head { display: flex; align-items: center; gap: 8px; width: 100%; min-width: 0; padding: 2px 0; border: 0; background: none; text-align: left; }
.group-head .chev { color: var(--text-dim); font-size: 10px; width: 12px; height: 12px; display: inline-flex; align-items: center; justify-content: center; transition: transform .15s; }
.group[data-collapsed="true"] .chev, .log[data-collapsed="true"] .chev { transform: rotate(-90deg); }
.title { font-size: var(--fs-title); font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: .04em; white-space: nowrap; }
.count { font-size: var(--fs-small); color: var(--text-faint); font-variant-numeric: tabular-nums; }
.rule { flex: 1 1 auto; height: 1px; background: var(--border); min-width: 8px; }
.group-head:hover .title { text-decoration: underline; text-underline-offset: 3px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(248px, 100%), 1fr)); gap: var(--gap); }
.group[data-collapsed="true"] .grid { display: none; }

/* program tile (a pane: clips, rows size from its width) */
.tile { display: flex; flex-direction: column; gap: 6px; min-width: 0; overflow: hidden; padding: 8px; cursor: pointer;
  background: transparent; border: 1px solid var(--border); border-radius: var(--r); }
.tile:hover { border-color: var(--accent); background: var(--hov); }
.tile[aria-selected="true"] { background: var(--sel); border-color: var(--selbd); }
.tile[aria-selected="true"]:hover { border-color: var(--accent); }
.tile-top { display: flex; align-items: flex-start; gap: 6px; min-width: 0; }
.pills { display: flex; flex-wrap: wrap; gap: 4px; flex: 1 1 auto; min-width: 0; }
.gh { flex: 0 0 auto; width: 20px; height: 20px; display: inline-flex; align-items: center; justify-content: center; border-radius: var(--r-box);
  border: 1px solid var(--btnbd); background: var(--btn); color: var(--text-dim); text-decoration: none; font-size: 12px; line-height: 1; }
.gh:hover { border-color: var(--accent); color: var(--text); }
.tile-id { display: flex; align-items: flex-start; gap: 8px; min-width: 0; }
.tile-id .txt { display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1 1 auto; }
.name { font-weight: 700; font-size: var(--fs-body); line-height: 1.25; overflow-wrap: anywhere; }
.desc { color: var(--dim); font-size: var(--fs-small); line-height: 1.4; overflow-wrap: anywhere;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: calc(2 * 1.4em); }
.ver { color: var(--text-dim); font-size: var(--fs-small); line-height: 1.45; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; min-height: calc(2 * 1.45em); }
.ver b { color: var(--text); font-weight: 400; white-space: nowrap; }
.ver .arrow { color: var(--warn); }
.tile-actions { display: flex; gap: 6px; margin-top: auto; min-width: 0; }
.tile-actions .btn.primary, .tile-actions .btn:disabled { flex: 1 1 auto; min-width: 0; }

/* pills: every status uses the SEL/SELBD recipe in its own colour (16% fill, 42% border) */
.pill { --c: var(--text-dim); display: inline-flex; align-items: center; gap: 4px; height: 18px; padding: 0 7px; border-radius: 999px;
  font-size: var(--fs-small); font-weight: 500; letter-spacing: .03em; line-height: 1; text-transform: uppercase; white-space: nowrap; color: var(--c);
  background: color-mix(in srgb, var(--c) 16%, transparent); border: 1px solid color-mix(in srgb, var(--c) 42%, transparent); }
.pill.s-ok { --c: var(--good); }
.pill.s-update { --c: var(--warn); }
.pill.s-missing { --c: var(--text-dim); }
.pill.s-needs { --c: var(--danger); }
.pill.s-web { --c: var(--accent); }
.pill.s-held { --c: var(--text-dim); }
.pill.s-held.glyph { padding: 0 6px; font-size: 9px; }
.pill.s-mod { --c: var(--danger); }
.pill.s-setup { --c: var(--accent); }

/* icons: real artwork (SVG/PNG) or the letter fallback drawn like the artwork's tile */
.icon { flex: 0 0 auto; display: block; width: var(--sz); height: var(--sz); }
.icon.sm { --sz: 36px; }
.icon.lg { --sz: 88px; }
.icon.fb { padding: calc(var(--sz) * .0625); }   /* the artwork's tile sits 32/512 inside its canvas */
.icon.fb span { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; border-radius: 23%;
  background: linear-gradient(var(--btn), var(--head)); box-shadow: inset 0 0 0 1px var(--border); color: var(--accent); font-weight: 700; }
.icon.sm.fb span { font-size: 16px; }
.icon.lg.fb span { font-size: 38px; }

/* ---------- Graphite cards: transparent, BORDER stroke, radius 7, 6px inner margin, accent title, 4px row gap ---------- */
.card { container-type: inline-size; display: flex; flex-direction: column; gap: var(--row-gap); min-width: 0; overflow: hidden;
  padding: var(--card-pad); border: 1px solid var(--border); border-radius: var(--r); background: transparent; }
.card > .title { margin-bottom: 2px; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: var(--gap); align-items: center; min-height: var(--ctl); }
.row > * { min-width: 0; }
.row-label { color: var(--text); overflow-wrap: anywhere; }
.row-val { color: var(--text-dim); overflow-wrap: anywhere; text-align: right; font-size: var(--fs-mono); }
.row-ctl { display: flex; align-items: center; gap: 6px; min-width: 0; }
.row-ctl.end { justify-content: flex-end; }
.caption { color: var(--text-faint); font-size: var(--fs-small); overflow-wrap: anywhere; }
.caption.warn { color: var(--warn); }
@container (max-width: 420px) {
  .row.stackable { grid-template-columns: minmax(0, 1fr); gap: 2px; }
}

/* inputs */
.input, select.input { height: var(--ctl); min-width: 0; width: 100%; padding: 0 8px; background: var(--field); color: var(--text);
  border: 1px solid var(--btnbd); border-radius: var(--r); font-size: var(--fs-mono); }
.input:hover, .input:focus { border-color: var(--accent); outline: none; }
select.input { cursor: pointer; }
select.input option { background: var(--field); color: var(--text); }

/* auto-update switch: same family as the Graphite checkbox (accent when on, steel outline when off) */
.switch { position: relative; flex: 0 0 auto; width: 34px; height: 18px; padding: 0; border-radius: 999px;
  border: 1.5px solid var(--text-dim); background: var(--field); transition: background .15s, border-color .15s; }
.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 11px; height: 11px; border-radius: 50%; background: var(--text-dim); transition: transform .15s, background .15s; }
.switch:hover { background-image: linear-gradient(var(--hov), var(--hov)); }
.switch[aria-checked="true"] { background: var(--accent); border-color: var(--accent); }
.switch[aria-checked="true"]::after { transform: translateX(16px); background: var(--text); }
.switch:disabled { cursor: default; opacity: .45; background-image: none; }   /* disabled = one step dimmer */

/* ---------- side panel ---------- */
.side-inner { display: flex; flex-direction: column; gap: var(--gap); padding: var(--gap); min-width: 0; }
.hero { display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; padding: 6px 4px 4px; min-width: 0; }
.hero .name { font-size: var(--fs-heading); }
.hero .pills { justify-content: center; flex: 0 0 auto; }
.hero .desc { -webkit-line-clamp: unset; min-height: 0; max-width: 34ch; font-size: 12px; }
.setup-list { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: var(--row-gap); font-size: 12px; line-height: 1.45; overflow-wrap: anywhere; }
.setup-list code { font-size: 11.5px; background: var(--field); border: 1px solid var(--border); border-radius: var(--r-box); padding: 0 4px; }

/* action list (side panel + "…" menu) */
.actions { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.action { display: flex; align-items: center; gap: 8px; width: 100%; min-height: 26px; padding: 2px 6px; border: 0; border-radius: var(--r);
  background: none; color: var(--text); text-align: left; text-decoration: none; font-size: var(--fs-body); overflow-wrap: anywhere; }
.action:hover { background: var(--hov); }
.action.danger, .action.danger .g { color: var(--danger); }
.action:disabled { color: var(--faint); cursor: default; background: none; }
.action:disabled .g { color: var(--faint); }
.action .sub { margin-left: auto; color: var(--text-faint); font-size: var(--fs-small); display: inline-flex; align-items: center; gap: 4px; }
.sep { height: 1px; background: var(--border); margin-block: 4px; flex: 0 0 auto; }

/* settings page: single column capped at ~520px */
.settings { display: flex; flex-direction: column; gap: var(--gap); width: 100%; max-width: 520px; min-width: 0; }
.settings-head { display: flex; align-items: center; gap: 8px; padding: 2px 0; }

/* popover ("…" menu): FIELD like any open menu */
.pop { position: fixed; z-index: 20; min-width: 220px; max-width: calc(100vw - 16px); padding: 4px; display: flex; flex-direction: column; gap: 1px;
  background: var(--field); border: 1px solid var(--border); border-radius: var(--r); box-shadow: 0 8px 24px var(--shade); }
.pop .branches { padding-left: 22px; display: flex; flex-direction: column; gap: 1px; }
.pop .switch-item { display: flex; align-items: center; gap: 8px; min-height: 26px; padding: 2px 6px; }
.pop .switch-item .lbl { flex: 1 1 auto; }

/* modal: dim backdrop swallows clicks, centred window, danger + Cancel; Enter confirms, Esc / backdrop cancels */
.modal-back { position: fixed; inset: 0; z-index: 30; display: flex; align-items: center; justify-content: center; padding: 16px; background: var(--shade); }
.modal { width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 8px; padding: 12px; min-width: 0;
  background: var(--panel); border: 1px solid var(--border); border-radius: var(--r); box-shadow: 0 8px 24px var(--shade); }
.modal h2 { margin: 0; font-size: var(--fs-body); font-weight: 700; color: var(--text); overflow-wrap: anywhere; }
.modal p { margin: 0; color: var(--dim); font-size: 12px; line-height: 1.5; overflow-wrap: anywhere; }
.modal .btns { display: flex; justify-content: flex-end; gap: var(--gap); flex-wrap: wrap; margin-top: 4px; }

/* log pane */
.log { flex: 0 0 auto; display: flex; flex-direction: column; min-width: 0; overflow: hidden; margin: 0 var(--gut-r) var(--gap) var(--gut-l);
  background: var(--panel2); border: 1px solid var(--border); border-radius: var(--r); }
.log-head { display: flex; align-items: center; gap: 8px; width: 100%; min-width: 0; padding: 4px 8px; border: 0; background: none; text-align: left; }
.log-head:hover .title { text-decoration: underline; text-underline-offset: 3px; }
.log-head .term { color: var(--text-dim); font-size: 12px; display: inline-flex; }
.log-body { height: 120px; overflow: auto; padding: 4px 8px; background: var(--field); border-top: 1px solid var(--border);
  font-size: var(--fs-mono); line-height: 1.6; }
.log[data-collapsed="true"] .log-body { display: none; }
.log-line { display: flex; gap: 12px; white-space: pre-wrap; overflow-wrap: anywhere; min-width: 0; }
.log-line .t { color: var(--text-faint); flex: 0 0 auto; font-variant-numeric: tabular-nums; }
.log-line > span:last-child { min-width: 0; }
.log-line.ok { color: var(--good); } .log-line.err { color: var(--danger); } .log-line.note { color: var(--accent); } .log-line.cmd { color: var(--text-dim); }

/* status bar */
.status { flex: 0 0 auto; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 4px 12px;
  background: var(--panel2); border-top: 1px solid var(--border); color: var(--dim); font-size: var(--fs-small);
  padding-block: 4px; padding-left: var(--gut-l); padding-right: var(--gut-r); }
.status .left, .status .right { display: flex; align-items: center; gap: 8px; min-width: 0; flex-wrap: wrap; }
.status .report { color: var(--accent); text-decoration: none; }
.status .report:hover { text-decoration: underline; }

.empty { color: var(--dim); padding: 40px 0; text-align: center; }

.sortbox { flex: 0 0 auto; display: flex; align-items: center; gap: 6px; }
.sortbox label { color: var(--dim); font-size: 12px; }
.sortbox select.input { width: auto; font-size: 12px; }
/* mono only where alignment matters */
.mono, .ver, .row-val, .log-body, .setup-list code, .count, .seg .n, .settings .input, .action .sub { font-family: var(--mono); }
.pop-head { padding: 4px 6px 2px; font-size: 12px; font-weight: 700; color: var(--text); overflow-wrap: anywhere; }

@media (max-width: 760px) {
  .body { flex-direction: column; overflow-y: auto; }
  .groups { overflow: visible; flex: 0 0 auto; padding-right: 0; }
  .side { flex: 0 0 auto; overflow: visible; }
  .search { flex: 1 1 100%; }
  .spacer { display: none; }
}
@media (max-width: 620px) {
  .seg { grid-auto-flow: row; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); height: auto; border-radius: 16px; flex: 1 1 100%; }
  .seg button { height: 26px; }
  .vdiv, .pagepill { display: none; }
}
@media (prefers-reduced-motion: reduce) { .chev, .switch, .switch::after { transition: none; } }
</style>

<div class="app">
  <header class="topbar">
    <div class="brand">ritz-get-gui</div>
    <span class="vdiv" aria-hidden="true"></span>
    <span class="pagepill" id="pagepill">Programs</span>
    <nav class="seg" id="tabs" aria-label="Filter"></nav>
    <div class="sortbox"><label for="sort">Sort</label>
      <select class="input" id="sort">
        <option value="default">Default</option><option value="name">Name</option>
        <option value="updates">Updates first</option><option value="installed">Installed first</option>
      </select></div>

/* ===== tiny element builder: h(tag, attrs, ...children) ===== */
function h(tag, attrs = {}, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) el.append(c);
  return el;
}

}

      h("span", { class: "chev" }, nf("chevron")),
      h("span", { class: "title" }, section.name),
      h("span", { class: "count" }, String(visible.length)),
      h("span", { class: "rule" })),
    h("div", { class: "grid", role: "listbox", "aria-label": section.name }, visible.map(renderCard)));
}

/* ===== side panel ===== */
const card = (title, ...kids) => h("section", { class: "card" }, h("h2", { class: "title", style: "margin:0" }, title), ...kids);
const row = (label, ...ctl) => h("div", { class: "row" }, h("span", { class: "row-label" }, label), h("div", { class: "row-ctl end" }, ...ctl));
function renderSide() {
  const side = document.getElementById("side");
  const e = byId(state.selected);
  side.replaceChildren();
  if (!e) { side.append(h("div", { class: "side-inner" }, h("div", { class: "empty" }, "Select a program to see its actions."))); return; }
  const meta = isWeb(e)
    ? [["id", e.name], ["url", shortHost(e.url)], ["source", "Ritze03/" + e.repo]]
    : [["id", e.name], ["installed", e.installed || "no"], ["latest", e.latest], ["source", "Ritze03/" + e.name]]
        .concat(e.needs ? [["missing tool", e.needs]] : [], e.modified ? [["local", `${e.modified} changed files`]] : []);
  const hint = !isInstalled(e) ? ["available once installed", ""] : e.modified ? ["modified · updates skipped until you reset", "warn"]
    : e.held ? [`held · ritz-get unhold ${e.name}`, ""] : ["included in Update all", ""];
  side.append(h("div", { class: "side-inner" },
    h("div", { class: "hero" }, icon(e, "lg"),
      h("div", { class: "name" }, disp(e)),
      h("div", { class: "pills" }, pills(e, true)),
      h("div", { class: "desc" }, e.desc)),
    isWeb(e) ? null : card("Program",
      h("div", { class: "row" }, h("span", { class: "row-label", id: "au-label" }, "Auto-update"), h("div", { class: "row-ctl end" }, autoSwitch(e, "au-label"))),
      h("div", { class: "caption " + hint[1] }, hint[0]),
      h("div", { class: "row" }, h("label", { class: "row-label", for: "branch" }, "Branch"),
        h("select", { class: "input", id: "branch", onchange: ev => { e.branch = ev.target.value; log(`${e.name}: switched to branch ${e.branch}`); render(); } },
          e.branches.map(b => h("option", { value: b, selected: b === e.branch }, b))))),
    e.setup?.length ? card("Additional steps required",
      h("ol", { class: "setup-list" }, e.setup.map(line => h("li", {}, richLine(line))))) : null,
    card("Actions", h("div", { class: "actions" }, renderActions(e))),
    card("Details", meta.map(([k, v]) => h("div", { class: "row" }, h("span", { class: "row-label", style: "color:var(--dim);font-size:var(--fs-mono)" }, k), h("span", { class: "row-val" }, v))))));
}

/* ===== setup line: plain text, URLs become links, `backticks` become code ===== */
function richLine(text) {
  return text.split(/(https?:\/\/[^\s]+|`[^`]+`)/).filter(Boolean).map(part =>
    /^https?:\/\//.test(part) ? h("a", { href: part, target: "_blank", rel: "noopener" }, part)
    : part.startsWith("`") ? h("code", {}, part.slice(1, -1)) : part);
}

/* ===== links built from the entry ===== */
const issuesUrl = e => github(e) + "/issues/new";
const ghUrl = e => github(e);                                   // repo root: tile icon + "Open on GitHub"
const readmeUrl = e => `${github(e)}/tree/${e.branch}#readme`;  // current branch's README (programs only)
function extLink(url, cls, kids, after) {
  return h("a", { class: cls, href: url, target: "_blank", rel: "noopener",
    onclick: ev => { ev.stopPropagation(); log(`$ xdg-open ${url}`, "cmd"); after && after(); } }, kids);
}

/* ===== auto-update switch: one component, used by the side panel and the popover ===== */
function autoSwitch(e, labelId) {
  return h("button", { class: "switch", role: "switch", "aria-checked": String(!e.held), "aria-labelledby": labelId, "data-switch": e.id,
    disabled: !isInstalled(e), onclick: ev => { ev.stopPropagation(); setHeld(e, !e.held); } });
}
function setHeld(e, held) {
  e.held = held;
  log(`$ ritz-get ${held ? "hold" : "unhold"} ${e.name}`, "cmd");
  render();
  document.querySelectorAll(`[data-switch="${CSS.escape(e.id)}"]`).forEach(s => s.setAttribute("aria-checked", String(!held))); // keeps the open popover in sync
}

/* ===== ONE action list, used by the side panel and the "…" popover =====
   Groups in fixed order: 1 lifecycle · 2 local (shortcut, folder) · 3 GitHub. A separator goes between groups. */
function actionGroups(e) {
  const shortcut = e.shortcut === false ? null      // D37: no shortcut capability, no shortcut action
    : e.shortcutOn ? { g: "minus", text: "Remove shortcut", act: () => toggleShortcut(e) }
    : { g: "plus", text: "Create shortcut", act: () => toggleShortcut(e), disabled: !isWeb(e) && !isInstalled(e) };
  if (isWeb(e)) return [[{ g: "ext", text: "Open", href: e.url }], [shortcut].filter(Boolean)];
  const life = e.status === "update" ? [{ g: "refresh", text: "Update", act: () => doUpdate(e) }]
    : e.status === "ok" ? [{ g: "check", text: "Up to date", disabled: true }]
    : [{ g: "download", text: "Install", act: () => doInstall(e) }];
  if (isInstalled(e)) life.push({ g: "trash", text: "Remove", act: () => doRemove(e), danger: true });
  if (e.modified) life.push({ g: "undo", text: "Reset (discard local changes)", act: () => confirmReset(e), danger: true });
  return [life,
    [shortcut, { g: "folder", text: "Open folder", act: () => log(`$ xdg-open ${state.dir}/${e.name}`, "cmd"), disabled: !isInstalled(e) }].filter(Boolean),
    [{ g: "github", text: "Open on GitHub", href: ghUrl(e) }, { g: "book", text: "Open README", href: readmeUrl(e) }, { g: "bug", text: "Report issue", href: issuesUrl(e) }]];
}
function renderActions(e, after) {
  const one = a => a.href
    ? extLink(a.href, "action", [glyph(a.g), a.text], after)
    : h("button", { class: "action" + (a.danger ? " danger" : ""), role: after ? "menuitem" : null, disabled: a.disabled,
        onclick: ev => { ev.stopPropagation(); after && after(); a.act && a.act(); } }, glyph(a.g), a.text);
  return actionGroups(e).filter(g => g.length).flatMap((g, i) => [i ? h("div", { class: "sep" }) : null, ...g.map(one)]);
}

/* ===== modal: confirm before discarding local changes (in-page, no browser dialog) ===== */
let modal = null;
function closeModal() { if (modal) { modal.back.remove(); document.removeEventListener("keydown", modal.keys, true); modal.ret?.focus?.(); modal = null; } }
function confirmReset(e) {
  const ok = () => { closeModal(); doReset(e); };
  const cancelBtn = h("button", { class: "btn", onclick: closeModal }, "Cancel");
  const back = h("div", { class: "modal-back", onclick: ev => { if (ev.target === back) closeModal(); } },
    h("div", { class: "modal", role: "dialog", "aria-modal": "true", "aria-labelledby": "reset-title" },
      h("h2", { id: "reset-title" }, `Discard local changes to ${disp(e)}?`),
      h("p", {}, `${e.modified} changed files in ${state.dir}/${e.name} will be lost. ritz-get re-clones origin/${e.branch} and re-installs it.`),
      h("div", { class: "btns" }, cancelBtn, h("button", { class: "btn danger", id: "reset-ok", onclick: ok }, "Discard and reset"))));
  const keys = ev => {
    if (ev.key === "Escape") { ev.preventDefault(); ev.stopPropagation(); closeModal(); }
    else if (ev.key === "Enter" && document.activeElement !== cancelBtn) { ev.preventDefault(); ev.stopPropagation(); ok(); }
  };
  modal = { back, keys, ret: document.activeElement };
  document.addEventListener("keydown", keys, true);
  document.body.append(back);
  back.querySelector("#reset-ok").focus();
}
function doReset(e) {
  log(`$ ritz-get reset ${e.name}`, "cmd");
  log(`${e.name}: discarded ${e.modified} changed files, re-cloned origin/${e.branch}`, "ok");
  e.modified = 0; e.held = false; render();
}

/* ===== popover for "…" ===== */
let pop = null;
function closePop() { if (pop) { pop.remove(); pop = null; } }
function openPop(e, anchor) {
  const r = anchor.getBoundingClientRect();
  closePop(); select(e.id);
  const item = (kids, act) => h("button", { class: "action", role: "menuitem", onclick: () => { closePop(); act && act(); } }, kids);
  const branchList = h("div", { class: "branches", hidden: true },
    (e.branches || []).map(b => item([b === e.branch ? "● " : "○ ", b], () => { e.branch = b; log(`${e.name}: switched to branch ${b}`); render(); })));
  pop = h("div", { class: "pop", role: "menu", "aria-label": "Actions for " + disp(e) },
    h("div", { class: "pop-head" }, disp(e)), h("div", { class: "sep" }),
    isWeb(e) ? null : h("button", { class: "action", role: "menuitem", onclick: ev => { ev.stopPropagation(); branchList.hidden = !branchList.hidden; } },
      glyph("chevronR"), "Branch", h("span", { class: "sub" }, e.branch)),
    isWeb(e) ? null : branchList,
    isWeb(e) ? null : h("div", { class: "switch-item" }, h("span", { class: "g" }, nf("refresh")),
      h("span", { class: "lbl", id: "pop-au" }, "Auto-update"), autoSwitch(e, "pop-au")),
    isWeb(e) ? null : h("div", { class: "sep" }),
    renderActions(e, closePop));
  document.body.append(pop);
  const pw = pop.offsetWidth, ph = pop.offsetHeight;
  pop.style.left = Math.max(8, Math.min(r.right - pw, innerWidth - pw - 8)) + "px";
  pop.style.top = Math.max(8, r.bottom + 4 + ph > innerHeight ? r.top - ph - 4 : r.bottom + 4) + "px";
  pop.addEventListener("click", ev => ev.stopPropagation());
}
document.addEventListener("click", closePop);
document.addEventListener("keydown", ev => { if (ev.key === "Escape") closePop(); });
addEventListener("resize", closePop);

/* ===== fake actions (they only write to the log) ===== */
function doUpdate(e, fromAll) {
  if (!fromAll) log(`$ ritz-get update ${e.name}`, "cmd");
  if (e.modified) { log(`${e.name}: SKIPPED (local changes; ritz-get reset ${e.name} to discard them)`, "err"); return; }
  log(`${e.name}: fetching origin/${e.branch}`); log(`${e.name}: building`);
  log(`${e.name}: updated ${e.installed.split(" ")[1]} -> ${e.latest.split(" ")[1]}`, "ok");
  e.installed = e.latest; e.status = "ok"; render();
  if (e.self) document.getElementById("restartbar").hidden = false; // the running app was replaced on disk
}
function doInstall(e) {
  log(`$ ritz-get install ${e.name}`, "cmd");
  if (e.status === "needs") { log(`${e.name}: error: ${e.needs} not found in PATH. Install ${e.needs} first, then retry.`, "err"); return; }
  log(`${e.name}: cloning github.com/Ritze03/${e.name} into ${state.dir}`); log(`${e.name}: building`);
  log(`${e.name}: installed ${e.latest.split(" ")[1]}`, "ok");
  if (e.setup?.length) { log("Additional steps required:", "note"); e.setup.forEach((l, i) => log(`  ${i + 1}. ${l}`, "note")); }
  e.installed = e.latest; e.status = "ok"; render();
}
function doRemove(e) { log(`$ ritz-get remove ${e.name}`, "cmd"); log(`${e.name}: removed`); e.status = "missing"; e.installed = null; e.shortcutOn = false; e.held = false; e.modified = 0; render(); }
function toggleShortcut(e) { e.shortcutOn = !e.shortcutOn; log(`${e.name}: ${e.shortcutOn ? "created" : "removed"} shortcut in ${state.shortcuts}`); render(); }

/* ===== settings view (D18/D34 repo folder, D35 shortcut folder) ===== */
function settingRow(label, key, tip, cmd) {
  const id = "set-" + key;
  const inp = h("input", { class: "input", id, spellcheck: "false", autocomplete: "off",
    oninput: ev => { state.draft[key] = ev.target.value; },
    onkeydown: ev => { if (ev.key === "Enter") apply(); } });
  inp.value = state.draft[key] ?? state[key];
  const apply = () => { const p = inp.value.trim() || state[key]; state[key] = p; delete state.draft[key]; log(cmd(p), "cmd"); render(); };
  return h("div", { class: "row stackable" }, h("label", { class: "row-label", for: id, title: tip }, label),
    h("div", { class: "row-ctl" }, inp, h("button", { class: "btn", onclick: apply }, "Change…")));
}
function renderSettings() {
  return h("div", { class: "settings" },
    h("div", { class: "settings-head" }, h("span", { class: "title" }, "Settings"), h("span", { class: "rule" })),
    card("Folders",
      settingRow("Repo folder", "dir", "Where ritz-get keeps every clone. Change… moves them all in one step (ritz-get dir PATH).", p => `$ ritz-get dir ${p}`),
      settingRow("Shortcut folder", "shortcuts", "Where .desktop shortcuts go. Change… moves the existing ones (ritz-get shortcuts PATH).", p => `$ ritz-get shortcuts ${p}`)),
    card("Config",
      h("div", { class: "row" }, h("span", { class: "row-label" }, "Config file"), h("span", { class: "row-val" }, "~/.config/ritz-get/config")),
      h("div", { class: "row" }, h("span", { class: "row-label" }, "Programs"), h("span", { class: "row-val" }, `${ALL.filter(isInstalled).length} installed · ${ALL.filter(e => e.shortcutOn).length} shortcuts`))));
}

/* ===== log drawer ===== */
const LOG = [];
let clock = new Date(2026, 9, 22, 14, 3, 12);
function log(text, kind) {
  clock = new Date(clock.getTime() + 1000 + Math.floor(Math.random() * 3000));
  LOG.push({ t: clock.toTimeString().slice(0, 8), text, kind });
  const body = document.getElementById("logbody");
  body.replaceChildren(...LOG.map(l => h("div", { class: "log-line " + (l.kind || "") }, h("span", { class: "t" }, l.t), h("span", {}, l.text))));
  body.scrollTop = body.scrollHeight;
  document.getElementById("logcount").textContent = LOG.length + " lines";
}
document.getElementById("loghead").addEventListener("click", ev => {
  const el = document.getElementById("log"), c = el.dataset.collapsed !== "true";
  el.dataset.collapsed = String(c); ev.currentTarget.setAttribute("aria-expanded", String(!c));
});

/* ===== top bar + render loop ===== */
function select(id) { state.selected = id; render(); }
/* sort WITHIN a section; sections keep manifest order. Array.sort is stable, so equal ranks (all websites) keep data order */
const SORTS = {
  default: null,
  name: (a, b) => disp(a).localeCompare(disp(b), undefined, { sensitivity: "base" }),
  updates: (a, b) => updRank(a) - updRank(b),
  installed: (a, b) => (isWeb(a) ? 2 : isInstalled(a) ? 0 : 1) - (isWeb(b) ? 2 : isInstalled(b) ? 0 : 1),
};
function updRank(e) {
  if (isWeb(e)) return 9;
  if (e.status === "update" && !e.modified) return 0;
  if (e.modified || e.status === "needs") return 1;
  return e.status === "ok" ? 2 : 3;
}
const sortEntries = list => SORTS[state.sort] ? [...list].sort(SORTS[state.sort]) : list;
function matches(e) {
  const q = state.query.trim().toLowerCase();
  return FILTERS.find(f => f.id === state.filter).test(e) && (!q || (disp(e) + " " + e.name + " " + e.desc).toLowerCase().includes(q));
}
function render() {
  document.getElementById("tabs").replaceChildren(...FILTERS.map(f => {
    const n = ALL.filter(f.test).length;
    return h("button", { "aria-pressed": String(state.view === "programs" && state.filter === f.id),
        onclick: () => { state.filter = f.id; state.view = "programs"; render(); } },
      f.label, h("span", { class: "n" + (f.id === "updates" && n ? " hot" : "") }, String(n)));
  }));
  const nUpd = ALL.filter(e => e.status === "update").length;
  const nFree = ALL.filter(e => e.status === "update" && !e.held && !e.modified).length; // held and modified are skipped by Update all
  const nHeld = ALL.filter(e => e.held).length;
  const ua = document.getElementById("updall"); ua.textContent = `Update all (${nFree})`; ua.disabled = nFree === 0;
  ua.title = nUpd > nFree ? `${nUpd - nFree} held or modified update${nUpd - nFree === 1 ? "" : "s"} skipped` : "";
  document.getElementById("gear").setAttribute("aria-pressed", String(state.view === "settings"));
  document.getElementById("pagepill").textContent = state.view === "settings" ? "Settings" : "Programs";
  const groups = document.getElementById("groups");
  if (state.view === "settings") groups.replaceChildren(renderSettings());
  else {
    const kids = SECTIONS.map(s => [s, sortEntries(s.entries.filter(matches))]).filter(([, v]) => v.length).map(([s, v]) => renderGroup(s, v));
    groups.replaceChildren(...(kids.length ? kids : [h("div", { class: "empty" }, "No programs match. Clear the search or pick another filter.")]));
  }
  renderSide();
  document.getElementById("statusleft").textContent =
    `checked 2 min ago · ${nUpd} update${nUpd === 1 ? "" : "s"} · ${ALL.filter(isInstalled).length} installed` + (nHeld ? ` · ${nHeld} held` : "");
}
/* sort choice: localStorage stands in for the real app's config file */
try { const v = localStorage.getItem("ritz-get-gui.sort"); if (v && v in SORTS) state.sort = v; } catch (_) {}
const sortSel = document.getElementById("sort");
sortSel.value = state.sort;
sortSel.addEventListener("change", ev => { state.sort = ev.target.value; try { localStorage.setItem("ritz-get-gui.sort", state.sort); } catch (_) {} render(); });
document.getElementById("gear").append(nf("gear"));
document.getElementById("searchicon").append(nf("search"));
document.getElementById("logchev").append(nf("chevron"));
document.getElementById("logterm").append(nf("terminal"));
document.getElementById("gear").addEventListener("click", () => { state.view = state.view === "settings" ? "programs" : "settings"; render(); });
document.getElementById("restart").addEventListener("click", () => { log("restart ritz-get-gui (exec ~/.local/bin/ritz-get-gui)"); document.getElementById("restartbar").hidden = true; });
document.getElementById("search").addEventListener("input", ev => { state.query = ev.target.value; state.view = "programs"; render(); });
document.getElementById("updall").addEventListener("click", () => { log("$ ritz-get update --yes", "cmd"); ALL.filter(e => e.status === "update").forEach(e =>
  e.held ? log(`${e.name}: held (ritz-get unhold ${e.name})`) : doUpdate(e, true)); });  // doUpdate skips modified checkouts
document.getElementById("check").addEventListener("click", () => {
  log(`checking ${ALL.filter(e => !isWeb(e)).length} repositories on github.com/Ritze03`);
  log(`up to date: ${ALL.filter(e => e.status === "ok").map(e => e.name).join(", ")}`);
  log(`updates: ${ALL.filter(e => e.status === "update").map(e => e.name).join(", ") || "none"}`);
});

/* example output so the drawer opens in a working state */
log("ts6tray: fetching origin/main");
log("ts6tray: building");
log("go: downloading go1.27.1 (linux/amd64)");
log("ts6tray: updated a596443 -> b12c3d4", "ok");
log("simple-screensharing: error: cargo not found in PATH. Install cargo first, then retry.", "err");
render();
</script>
