<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E2129"/>
      <stop offset="1" stop-color="#14161B"/>
    </linearGradient>
    <radialGradient id="glow" gradientUnits="userSpaceOnUse" cx="450" cy="450" r="360">
      <stop offset="0" stop-color="#A78BFA" stop-opacity="0.25"/>
      <stop offset="0.55" stop-color="#1588FA" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#1588FA" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="clip">
      <rect x="32" y="32" width="448" height="448" rx="104"/>
    </clipPath>
  </defs>
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#tile)"/>
  <g clip-path="url(#clip)">
    <rect x="32" y="32" width="448" height="448" fill="url(#glow)"/>
  </g>
  <rect x="34" y="34" width="444" height="444" rx="102" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="4"/>
  <!-- channel tree: parent row, selected child, child. Pills 64 tall, 32 gap, edges on 16px pixel grid -->
  <g transform="translate(8 0)">
    <circle cx="128" cy="160" r="16" fill="#A78BFA"/>
    <rect x="160" y="128" width="224" height="64" rx="32" fill="#F3F4F6"/>
    <circle cx="192" cy="256" r="16" fill="#F3F4F6"/>
    <rect x="224" y="224" width="160" height="64" rx="32" fill="#1588FA"/>
    <circle cx="192" cy="352" r="16" fill="#A78BFA"/>
    <rect x="224" y="320" width="128" height="64" rx="32" fill="#F3F4F6"/>
  </g>
</svg>
