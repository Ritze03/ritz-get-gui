<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0D2A4A"/>
      <stop offset="1" stop-color="#081B31"/>
    </linearGradient>
    <radialGradient id="glow" cx="256" cy="256" r="190" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1FA3D6" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#1FA3D6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#tile)"/>
  <rect x="34" y="34" width="444" height="444" rx="102" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="4"/>
  <circle cx="256" cy="256" r="190" fill="url(#glow)"/>
  <!-- head: the original's white ring around a white core -->
  <circle cx="256" cy="190" r="64" fill="none" stroke="#F3F4F6" stroke-width="20"/>
  <circle cx="256" cy="190" r="42" fill="#F3F4F6"/>
  <!-- shoulders: neck notch hugs the head, base cut by the original disc's arc -->
  <path d="M128 342C142 312 170 285 204 276A100 100 0 0 0 308 276C342 285 370 312 384 342A176 176 0 0 1 128 342Z" fill="#F3F4F6" stroke="#F3F4F6" stroke-width="8" stroke-linejoin="round"/>
</svg>
