<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E2129"/>
      <stop offset="1" stop-color="#14161B"/>
    </linearGradient>
    <radialGradient id="glow" cx="256" cy="256" r="190" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6AA8FF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#6AA8FF" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="tileclip"><rect x="32" y="32" width="448" height="448" rx="104"/></clipPath>
  </defs>
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#tile)"/>
  <rect x="34" y="34" width="444" height="444" rx="102" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="4"/>

  <!-- window chrome: solid title bar clipped to the tile -->
  <g clip-path="url(#tileclip)">
    <rect x="32" y="32" width="448" height="80" fill="#6AA8FF"/>
  </g>
  <circle cx="100" cy="72" r="12" fill="#14161B" fill-opacity="0.55"/>
  <circle cx="128" cy="72" r="12" fill="#14161B" fill-opacity="0.55"/>
  <circle cx="156" cy="72" r="12" fill="#14161B"/>
  <g transform="translate(256 272) scale(0.86) translate(-256 -256)">
  <circle cx="256" cy="256" r="190" fill="url(#glow)"/>
  <!-- parcel as isometric cube: outline near-white, primary stroke 32 -->
  <path d="M256 128L367 192V320L256 384L145 320V192Z" fill="none" stroke="#F3F4F6" stroke-width="32" stroke-linejoin="round"/>
  <!-- top-face edges, secondary stroke 20, broken where the arrow passes -->
  <path d="M145 192L206 227M367 192L306 227" fill="none" stroke="#F3F4F6" stroke-width="20" stroke-linecap="round"/>
  <!-- install arrow: accent blue -->
  <path d="M256 186V326M204 274L256 326L308 274" fill="none" stroke="#6AA8FF" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>
</g>
</svg>
